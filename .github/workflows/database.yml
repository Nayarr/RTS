# Base de données : lint du schéma + tests pgTAP sur une base Supabase jetable.
# Tourne à chaque PR vers main (sans filtre de chemins, pour pouvoir être rendu
# obligatoire dans la protection de branche).
name: Base de données

on:
  pull_request:
    branches: [main]
  # Pas de relance à chaque push sur main : le code a déjà été testé dans sa PR
  # (fusionnée avec main). Relance manuelle possible (« Run workflow »).
  workflow_dispatch:

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint et tests pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le CLI Supabase
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Démarrer Postgres et appliquer toutes les migrations depuis zéro
        run: |
          # Le registre d'images de Supabase (public.ecr.aws) refuse parfois les téléchargements
          # (« Rate exceeded ») : jusqu'à 3 essais, conteneurs nettoyés entre deux.
          for attempt in 1 2 3; do
            supabase db start && exit 0
            echo "::warning::Démarrage de Supabase échoué (essai $attempt/3), nouvel essai dans 30 s"
            supabase stop --no-backup || true
            sleep 30
          done
          exit 1

      - name: Lint du schéma (fonctions, types, SQL)
        run: supabase db lint --level warning --fail-on warning

      - name: Tests pgTAP (métier, sécurité, garde-fous)
        run: supabase test db

      - name: Arrêter Supabase
        if: always()
        run: supabase stop --no-backup
