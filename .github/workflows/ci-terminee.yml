# Fin de CI d'une PR : commentaire sur la PR avec le résultat de chaque workflow (Application, Base
# de données), pour savoir que la PR est prête sans surveiller la CI. Le commentaire sert aussi de
# signal pour enchaîner la fusion d'une pile de PR.
#
# workflow_run : seule la version de ce fichier sur main est utilisée.
# Sécurité : aucun code de la PR n'est exécuté ; seuls le nom, la conclusion, le lien et le numéro
# de PR fournis par GitHub sont utilisés, passés par variables d'environnement.
name: CI terminée

on:
  workflow_run:
    workflows: [Application, Base de données]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  commentaire:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Commenter la PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          case "$CONCLUSION" in
            success) RESULT="réussie" ;;
            failure) RESULT="en échec" ;;
            cancelled) RESULT="annulée" ;;
            timed_out) RESULT="trop longue (délai dépassé)" ;;
            skipped) RESULT="non lancée" ;;
            *) RESULT="$CONCLUSION" ;;
          esac
          gh pr comment "$PR" --repo "$REPO" \
            --body "CI terminée : « $WORKFLOW » $RESULT sur ${SHA:0:7} ([détails]($RUN_URL))."
